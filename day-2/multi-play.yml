---
- name: Configure web servers
  hosts: web
  become: true

  tasks:
    - name: Ensure Nginx is installed
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: true


- name: Configure app servers
  hosts: app
  become: true

  tasks:
    - name: Create application directory
      file:
        path: /opt/myapp
        state: directory
        owner: ubuntu
        mode: '0755'


- name: Configure database servers
  hosts: db
  become: true

  tasks:
    - name: Ensure MySQL is installed
      apt:
        name: mysql-server
        state: present
