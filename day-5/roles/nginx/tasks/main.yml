---
# tasks file for roles/nginx

- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true
  tags: nginx
  notify: Reload Nginx

- name: Remove default Nginx site config
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  tags: nginx
  notify: Reload Nginx

- name: Deploy main Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'
  tags: nginx
  notify: Reload Nginx

- name: Deploy reverse proxy configuration
  template:
    src: app-proxy.conf.j2
    dest: /etc/nginx/conf.d/app-proxy.conf
    mode: '0644'
  tags: nginx
  notify: Reload Nginx

- name: Test Nginx configuration
  command: nginx -t
  changed_when: false
  tags: nginx

- name: Start and enable Nginx
  service:
    name: nginx
    state: started
    enabled: true
  tags: nginx
